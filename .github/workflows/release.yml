name: Release

# Builds installers for macOS, Windows and Linux.
# - Push a tag like v0.1.0  → a *draft* GitHub Release with every installer
#   and a SHA256SUMS file (publish it by hand after checking it).
# - Run manually (Actions → Release → Run workflow):
#   - without a version → installers attached to the run as artifacts only;
#   - with a version (e.g. v0.1.0) → the tag is created on the commit the
#     workflow runs on, and the release is published as a pre-release
#     (or as a draft if "draft" is ticked).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (leave empty for a build only)"
        required: false
        default: ""
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false
  # Also callable from ci.yml (Actions → CI → Run workflow with a version),
  # so the release only happens after the whole test suite passed.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      draft:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos:
    name: macOS (universal DMG, widget included)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: brew install xcodegen
      - name: Build, embed widget, sign (ad-hoc), package
        env:
          UNIVERSAL: "1"
          DMG_OUT: ${{ github.workspace }}/dist/MediaFlow-macOS-universal.dmg
        run: scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (installer + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - run: npx tauri build --bundles nsis,msi
        working-directory: app
      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem target/release/bundle/nsis/*.exe | Copy-Item -Destination dist/MediaFlow-Windows-x64-setup.exe
          Get-ChildItem target/release/bundle/msi/*.msi | Copy-Item -Destination dist/MediaFlow-Windows-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (AppImage, deb, rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev rpm
      - run: npm ci
        working-directory: app
      - run: npx tauri build --bundles appimage,deb,rpm
        working-directory: app
      - name: Collect installers
        run: |
          mkdir -p dist
          cp target/release/bundle/appimage/*.AppImage dist/MediaFlow-Linux-x86_64.AppImage
          cp target/release/bundle/deb/*.deb dist/MediaFlow-Linux-amd64.deb
          cp target/release/bundle/rpm/*.rpm dist/MediaFlow-Linux-x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: dist/*
          if-no-files-found: error

  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS-arm64, bin: mediaflow }
          - { os: windows-latest, name: Windows-x64, bin: mediaflow.exe }
          - { os: ubuntu-22.04, name: Linux-x86_64, bin: mediaflow }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p mediaflow-cli
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/mediaflow-cli-${{ matrix.name }}${{ endsWith(matrix.bin, '.exe') && '.exe' || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    needs: [macos, windows, linux, cli]
    runs-on: ubuntu-latest
    steps:
      # Only this workflow's artifacts: when called from ci.yml the run also
      # holds CI's own build artifacts, which must not end up in the release.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cli-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: ls -la && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          # Tag push: draft. Manual run: tag created on this commit.
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: MediaFlow ${{ inputs.version || github.ref_name }}
          draft: ${{ github.event_name == 'push' || inputs.draft }}
          prerelease: ${{ startsWith(inputs.version || github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: dist/*
