name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Engine & CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy -p mediaflow-core -p mediaflow-cli --all-targets -- -D warnings
      - run: cargo test -p mediaflow-core -p mediaflow-cli

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  desktop:
    name: Desktop build (${{ matrix.os }})
    needs: [engine, ui]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
        working-directory: app
      - run: npx tauri build --no-bundle
        working-directory: app

  macos-widget:
    name: macOS widget (StatusKit tests + extension build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: StatusKit unit tests (shared JSON contract with Rust)
        run: swift test --package-path app/macos-widget/StatusKit
      - run: brew install xcodegen
      - name: Build the widget extension (unsigned)
        working-directory: app/macos-widget
        run: |
          xcodegen generate
          xcodebuild -project MediaFlowWidget.xcodeproj -scheme MediaFlowWidget \
            -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

  macos-dmg:
    name: macOS app + widget (DMG artifact)
    needs: [engine, ui, macos-widget]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: brew install xcodegen
      - name: Build, embed widget, ad-hoc sign, package
        run: scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-macos-unsigned
          path: target/release/MediaFlow-macos.dmg
          if-no-files-found: error
          retention-days: 14
