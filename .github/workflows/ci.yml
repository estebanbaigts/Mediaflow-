name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release this commit as version (e.g. v0.1.0). Leave empty to only run CI."
        required: false
        default: ""
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  engine:
    name: Engine & CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy -p mediaflow-core -p mediaflow-cli --all-targets -- -D warnings
      - run: cargo test -p mediaflow-core -p mediaflow-cli

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  desktop:
    name: Installers (${{ matrix.name }})
    needs: [engine, ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: Linux, bundles: "appimage,deb,rpm" }
          - { os: windows-latest, name: Windows, bundles: "nsis,msi" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev rpm
      - run: npm ci
        working-directory: app
      - run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-${{ matrix.name }}-unsigned
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  macos-widget:
    name: macOS widget (StatusKit tests + extension build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: StatusKit unit tests (shared JSON contract with Rust)
        run: swift test --package-path app/macos-widget/StatusKit
      - run: brew install xcodegen
      - name: Build the widget extension (unsigned)
        working-directory: app/macos-widget
        run: |
          xcodegen generate
          xcodebuild -project MediaFlowWidget.xcodeproj -scheme MediaFlowWidget \
            -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

  macos-dmg:
    name: macOS app + widget (DMG artifact)
    needs: [engine, ui, macos-widget]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: brew install xcodegen
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build (universal), embed widget, ad-hoc sign, package
        env:
          UNIVERSAL: "1"
        run: scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-macos-unsigned
          path: target/release/MediaFlow-macos.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release ${{ inputs.version }}
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.version, 'v')
    needs: [engine, ui, desktop, macos-widget, macos-dmg]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
      draft: ${{ inputs.draft }}
