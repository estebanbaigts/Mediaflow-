[package]
name = "mediaflow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MediaFlow command-line interface"

[[bin]]
name = "mediaflow"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "7.0.0"
mediaflow-core = { version = "0.1.0", path = "../mediaflow-core" }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
